<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalSubHub — Worldwide movie discovery</title><style>body{font:16px system-ui;background:#101827;color:#f4f7ff;margin:0}header,main,footer{max-width:1100px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}input,select{background:#243149;color:white;padding:12px;border:1px solid #526079;border-radius:8px;margin:5px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.movie{background:#1d293d;border-radius:12px;padding:15px}.movie small{color:#bac7dc}.notice{background:#243149;padding:14px;border-radius:10px;margin:15px 0}a{color:#8ac8ff}button{cursor:pointer}</style><header><h1>🎬 GlobalSubHub</h1><span>Movie discovery & authorized subtitles</span></header><main><p>Discover new and upcoming movies around the world.</p><div class="notice">Movie listings do not imply subtitles are available. Downloads are provided only with documented permission.</div><input id="q" placeholder="Search movies" aria-label="Search movies"><select id="type"><option value="">All releases</option><option value="released">Released</option><option value="upcoming">Upcoming</option></select><select id="lang"><option value="">All original languages</option></select><p id="status"></p><section id="grid"></section></main><footer><p>GlobalSubHub · <a href="/rights.html">Rights and takedown policy</a></p><p id="attribution"></p></footer><script>
let movies=[];const q=document.querySelector('#q'),type=document.querySelector('#type'),lang=document.querySelector('#lang'),grid=document.querySelector('#grid');function render(){const term=q.value.toLowerCase();let rows=movies.filter(m=>(m.title||'').toLowerCase().includes(term)&&(!type.value||m.status===type.value)&&(!lang.value||m.original_language===lang.value));document.querySelector('#status').textContent=rows.length+' movie listings';grid.replaceChildren();for(const m of rows.slice(0,300)){let card=document.createElement('article');card.className='movie';let h=document.createElement('h3');h.textContent=m.title;let info=document.createElement('small');info.textContent=[m.release_date||'Date unconfirmed',m.original_language||'Unknown language',m.status].join(' · ');let p=document.createElement('p');p.textContent=(m.overview||'No synopsis available').slice(0,220);let availability=document.createElement('p');availability.textContent='Authorized subtitles: Not available';card.append(h,info,p,availability);grid.append(card)}}fetch('/data/movies.json').then(r=>{if(!r.ok)throw Error('Missing catalog');return r.json()}).then(d=>{movies=d.movies||[];let langs=[...new Set(movies.map(m=>m.original_language).filter(Boolean))].sort();for(let l of langs){let opt=document.createElement('option');opt.value=l;opt.textContent=l;lang.append(opt)}document.querySelector('#attribution').textContent=d.source==='tmdb'?'Movie metadata from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.':'';render()}).catch(()=>document.querySelector('#status').textContent='Catalog not available yet');[q,type,lang].forEach(e=>e.addEventListener('input',render));
</script></html>
